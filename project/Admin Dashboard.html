<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>CleanVillage · Console admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>
  html, body { margin: 0; min-height: 100vh; }
  ::selection { background: var(--color-mint-300); color: var(--color-teal-800); }
  [data-lucide] { display: inline-block; vertical-align: middle; }
  button, input, select, textarea { font-family: inherit; }
  input:focus, textarea:focus, select:focus {
    border-color: var(--color-teal-500) !important;
    box-shadow: var(--shadow-focus) !important;
  }
  table { border-spacing: 0; }
  /* hide scrollbar visually on sidebar */
  aside::-webkit-scrollbar { width: 4px; }
  aside::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }
</style>
</head>
<body data-screen-label="CleanVillage admin">
<div id="root"></div>

<!-- Reuse storefront components (ProductIllustration etc.) -->

<script type="text/babel" src="admin/products.jsx"></script>

<script type="text/babel" src="admin/app.jsx"></script>
</body>
</html>
