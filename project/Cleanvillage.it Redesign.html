<style>
  html, body { min-height: 100%; }
  body { margin: 0; }
  #root { display: flex; flex-direction: column; min-height: 100vh; }
  main { flex: 1; }
  ::selection { background: var(--color-mint-300); color: var(--color-teal-800); }
  /* Hide scrollbar on sidebar */
  aside::-webkit-scrollbar { width: 4px; }
  aside::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }
  /* Fixes for lucide icons inside inline-flex spans */
  [data-lucide] { display: inline-block; vertical-align: middle; }
  button, input, select, textarea { font-family: inherit; }
  input:focus, textarea:focus, select:focus {
    border-color: var(--color-teal-500) !important;
    box-shadow: var(--shadow-focus) !important;
  }
  /* Compact density override */
  [data-density="compact"] section { padding-top: 64px !important; padding-bottom: 64px !important; }
</style>
</head>
<body data-screen-label="CleanVillage redesign">
<div id="root"></div>
