<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>CleanVillage · Hero Variations</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin:0; min-height:100vh; background:#F0EDE7; }
  [data-lucide] { display: inline-block; vertical-align: middle; }
  button, input, select, textarea { font-family: inherit; }
  ::selection { background: var(--color-mint-300); color: var(--color-teal-800); }
</style>
</head>
<body data-screen-label="Hero variations canvas">
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="prototype/components.jsx"></script>
<script type="text/babel" src="prototype/hero-variations.jsx"></script>

<script type="text/babel">
const { useEffect } = React;

function App() {
  useEffect(() => {
    if (window.lucide) window.lucide.createIcons();
  });

  return (
    <DesignCanvas>
      <DCSection id="heroes" title="Hero · 4 direzioni" subtitle="Quattro modi di aprire la homepage CleanVillage. Tutti italiani, tutti in linea con il design system. Clicca un artboard per metterlo a tutto schermo.">
        <DCArtboard id="a" label="A · Editorial Light · premium B2B" width={1440} height={1040}>
          <HeroVarA/>
        </DCArtboard>
        <DCArtboard id="b" label="B · Dark Magazine · audace, editoriale" width={1440} height={1040}>
          <HeroVarB/>
        </DCArtboard>
        <DCArtboard id="c" label="C · Trade-Catalog Dense · buyer focused" width={1440} height={1040}>
          <HeroVarC/>
        </DCArtboard>
        <DCArtboard id="d" label="D · Showroom-first · imagery led" width={1440} height={1040}>
          <HeroVarD/>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
